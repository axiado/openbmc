KERNEL_DEVICETREE = "axiado/ax3000-scm3003-qemu.dtb"

UBOOT_MACHINE ?= "ax3000_evk_defconfig"
KBUILD_DEFCONFIG ?= "ax3000_defconfig"

BUILD_VAR ?= "dev"

require conf/machine/include/ax3000.inc
require conf/machine/include/obmc-evb-common.inc

KERNEL_IMAGETYPE += "Image"
IMAGE_FSTYPES += "wic.qcow2"
WKS_FILE = "emmc-evk-axiado.wks.in"

FLASH_SIZE = "65535"
SERIAL_CONSOLES = "115200;ttyPS3"

OBMC_COMPATIBLE_NAMES = "ax3000"
EXTENDED_VERSION = "${DISTRO_VERSION}"

IMAGE_FEATURES:remove = " \
    obmc-chassis-mgmt \
    obmc-chassis-state-mgmt \
    obmc-fan-control \
    obmc-fan-mgmt \
    obmc-host-ipmi \
    obmc-host-state-mgmt \
"

VIRTUAL-RUNTIME_obmc-inventory-manager = "entity-manager"
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "dbus-sensors"
