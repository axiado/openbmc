# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ax3000-qemu"
BBFILE_PATTERN_ax3000-qemu = "^${LAYERDIR}/"
LAYERSERIES_COMPAT_ax3000-qemu = "wrynose whinlatter"
