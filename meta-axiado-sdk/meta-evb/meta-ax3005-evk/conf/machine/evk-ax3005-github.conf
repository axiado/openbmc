KERNEL_DEVICETREE = "axiado/ax3005-evk.dtb"
KERNEL_DEVICETREE += "axiado/scm3005-mt-evk.dtb"

UBOOT_MACHINE ?= "ax3005_scm3005_defconfig"
KBUILD_DEFCONFIG ?= "ax3005_defconfig"

BUILD_VAR ?= "ax3005"

require conf/machine/include/ax3005.inc
require conf/machine/include/obmc-evb-common.inc
require conf/distro/include/pldm.inc

WKS_FILE = "emmc-evk-ax3005.wks.in"

FLASH_SIZE = "65535"
SERIAL_CONSOLES = "115200;ttyPS3"

EXTENDED_VERSION = "${DISTRO_VERSION}"

IMAGE_FEATURES:remove = " \
    obmc-chassis-mgmt \
    obmc-chassis-state-mgmt \
    obmc-fan-control \
    obmc-fan-mgmt \
    obmc-host-ipmi \
    obmc-host-state-mgmt \
    obmc-ikvm \
"
IMAGE_FEATURES += "package-management"

USE_CALIPTRA_DUMMY_KEYS = "1"

VIRTUAL-RUNTIME_obmc-inventory-manager = "entity-manager"
VIRTUAL-RUNTIME_obmc-sensors-hwmon = "dbus-sensors"
